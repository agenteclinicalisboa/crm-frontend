services:
  crm-frontend:
    container_name: crm-frontend
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.crm-frontend.rule=Host(`lisboaestetica.com.br`)"
      - "traefik.http.routers.crm-frontend.entrypoints=websecure"
      - "traefik.http.routers.crm-frontend.tls.certresolver=le"
      - "traefik.http.routers.crm-frontend-ip.rule=PathPrefix(`/`)"
      - "traefik.http.routers.crm-frontend-ip.entrypoints=web"
      - "traefik.http.routers.crm-frontend-ip.priority=10"
      - "traefik.http.services.crm-frontend.loadbalancer.server.port=80"
      - "traefik.http.middlewares.crm-frontend.headers.accesscontrolallowmethods=GET,POST,PUT,OPTIONS"
      - "traefik.http.middlewares.crm-frontend.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.crm-frontend.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.middlewares.crm-frontend.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.crm-frontend.headers.addvaryheader=true"
    networks:
      - traefik-net
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - crm_frontend_data:/home/node/.cache

volumes:
  crm_frontend_data:

networks:
  traefik-net:
    external: true
